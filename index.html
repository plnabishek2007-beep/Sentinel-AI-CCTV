<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureSight AI | Secure Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* SAME UI (unchanged visuals) */
body {
    background:#030712;
    color:white;
    font-family:'Outfit',sans-serif;
}

/* keep your full CSS (no change needed) */
</style>
</head>

<body>

<!-- 🔐 CONSENT BANNER -->
<div style="
position:fixed;
top:0;
left:0;
right:0;
background:#ef4444;
padding:10px;
text-align:center;
font-size:14px;
z-index:9999;">
⚠️ AI Surveillance Active — Authorized Access Only
</div>

<!-- YOUR EXISTING UI (UNCHANGED STRUCTURE) -->
<!-- KEEP ALL YOUR HTML SAME -->

<img id="video-feed" style="width:100%; max-width:800px; margin-top:60px; border-radius:12px;">

<div style="text-align:center; margin-top:20px;">
<button onclick="toggleCamera()">Toggle Camera</button>
<button onclick="toggleAlerts()">Toggle Alerts</button>
</div>

<script>
/* ================= 🔐 SECURE CONFIG ================= */

// Ask API key securely (no hardcoding)
const API_KEY = prompt("🔐 Enter Secure Access Key:");

if(!API_KEY){
    alert("Access Denied");
    throw new Error("No API Key");
}

/* ================= 🔐 LOAD STREAM ================= */

function loadStream(){
    const img = document.getElementById("video-feed");
    img.src = `/stream?api_key=${API_KEY}`;
}
loadStream();

/* ================= 🔐 FETCH STATUS ================= */

async function fetchStatus(){
    try{
        const res = await fetch("/status",{
            headers:{
                "x-api-key":API_KEY
            }
        });

        if(res.status === 401){
            alert("❌ Unauthorized Access");
            return;
        }

        const data = await res.json();

        console.log("Status:", data);

    }catch(err){
        console.error(err);
    }
}

/* ================= 🔐 CONTROL ================= */

async function toggleCamera(){
    await fetch("/control",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "x-api-key":API_KEY
        },
        body:JSON.stringify({camera:true})
    });
}

async function toggleAlerts(){
    await fetch("/control",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "x-api-key":API_KEY
        },
        body:JSON.stringify({alerts:true})
    });
}

/* ================= AUTO UPDATE ================= */

setInterval(fetchStatus,3000);

</script>

</body>
</html>
